# ==========================================================================
# build-iso.yml — build the kacuOS live/install ISO in GitHub Actions.
#
# The build runs against the profile in archiso/kacu-desktop:
#   1. an Arch Linux container (archlinux:latest),
#   2. bake.py compiles the tooling (kacuctl/Rust, kacu-sysinfo/C,
#      langley/Go) and copies it plus presets into the profile's airootfs,
#   3. mkarchiso builds the ISO, which is uploaded as a workflow artifact.
#
# NOTE on the "target not found" class of errors: archiso profiles use
# `Include = /etc/pacman.d/mirrorlist` — that is the HOST (container)
# mirrorlist. If it has no servers, every [extra] package fails with
# "target not found". We therefore write a mirrorlist with two working
# servers before the first pacman -Syu.
#
# setup_boot_files.py is intentionally NOT run here: the bootloader files
# (syslinux/, efiboot/, grub/) are already committed in the profile, and a
# fresh copy from releng would also overwrite the custom pacman.conf.
# ==========================================================================
name: build-iso

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    name: build-iso
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          # The archiso profile reads the host mirrorlist; give it working
          # servers FIRST, then upgrade and install the toolchain.
          printf '%s\n' \
            'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' \
            'Server = https://mirrors.kernel.org/archlinux/$repo/os/$arch' \
            > /etc/pacman.d/mirrorlist
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel git python cargo go archiso

      - name: Bake tooling into the profile
        run: python3 archiso/bake.py --profile kacu-desktop

      - name: Sanitize package lists
        # mkarchiso strips inline '# comment' text but keeps the trailing
        # spaces, and pacman then reports "target not found: <pkg>   ".
        # Strip inline comments plus trailing whitespace everywhere as a
        # safety net (keep the package lists clean in the repo, too).
        run: |
          set -euo pipefail
          for list in archiso/*/packages.x86_64; do
            sed -i -E 's/[[:space:]]+#.*$//; s/[[:space:]]+$//' "$list"
            echo "sanitized: $list"
          done

      - name: Build the ISO
        run: |
          set -euo pipefail
          cd archiso/kacu-desktop
          mkarchiso -v -o "${GITHUB_WORKSPACE}/out" .

      - name: Show the result
        run: |
          ls -lh out/
          sha256sum out/*.iso

      - name: Upload the ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: kacuos-live-iso
          path: out/*.iso
          if-no-files-found: error
          retention-days: 14
