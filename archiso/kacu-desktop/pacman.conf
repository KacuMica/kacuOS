#
# /etc/pacman.conf — kacuOS
#
# Used by mkarchiso when it installs packages into the airootfs. The
# `Include = /etc/pacman.d/mirrorlist` lines refer to the *host* mirrorlist
# (the machine building the ISO), which is what mkarchiso expects.
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
