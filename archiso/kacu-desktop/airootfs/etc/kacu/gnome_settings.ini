# ==========================================================================
# kacuOS — base GNOME defaults (dconf keyfile)
#
# Group names are ABSOLUTE paths *without* a leading slash
# (e.g. [org/gnome/desktop/interface]). This exact format is understood by:
#
#   1. system-wide defaults (recommended, applies to every user):
#          cp gnome_settings.ini /etc/dconf/db/local.d/00-kacu
#          dconf update
#   2. a single user session:
#          dconf load / < gnome_settings.ini
#
# kacu-setup does both for you:
#          sudo kacu-setup --system     # method 1
#          kacu-setup --user            # method 2
#
# Settings here are tuned for speed on old hardware (HDD, Core 2 Duo, 4 GB):
# no animations, no file indexing, no background app search.
# ==========================================================================

[org/gnome/desktop/interface]
# The single biggest perceived-speed win on weak GPUs: kill all shell animations.
enable-animations=false
gtk-theme='Adwaita'
icon-theme='Adwaita'
cursor-theme='Adwaita'
color-scheme='prefer-dark'
clock-format='24h'

[org/gnome/desktop/wm/preferences]
button-layout='appmenu:minimize,maximize,close'

[org/gnome/desktop/search-providers]
# Do not fan out the Activities search to every installed app (fewer processes
# spawned, less disk I/O when you press Super).
disable-external=true

[org/gnome/mutter]
# No experimental compositor features; keep it boring and stable.
experimental-features=@as []
# Static workspaces use slightly less bookkeeping than dynamic ones.
dynamic-workspaces=false

[org/gnome/desktop/session]
# Blank the screen after 5 minutes idle (power on HDD/display).
idle-delay=uint32 300

[org/gnome/settings-daemon/plugins/power]
# Live/desktop default: never suspend on AC. Change after install if you like.
sleep-inactive-ac-type='nothing'

[org/gnome/shell]
favorite-apps=['org.gnome.Console.desktop', 'org.gnome.Nautilus.desktop', 'org.gnome.Settings.desktop']

# Do not let GNOME Software pull metadata/updates in the background
# (the package is not installed by default; harmless if it is).
[org/gnome/software]
download-updates=false
allow-updates=false

# --------------------------------------------------------------------------
# Tracker 3 — file indexing. This is the biggest avoidable source of
# background disk I/O on an HDD. Disable monitoring and index root dirs.
# (Belt-and-braces: kacu-setup also masks the tracker user services.)
# --------------------------------------------------------------------------
[org/freedesktop/tracker3/miner/files]
index-recursive-directories=@as []
index-single-directories=@as []
enable-monitors=false
