# ==========================================================================
# kacuOS — kernel tuning for a zram-backed 4 GB machine on a spinning disk
# Applied automatically at boot (systemd-sysctl); also read by kacu-setup.
# ==========================================================================

# With zram, swapping is cheap, so tell the kernel to favour it aggressively.
vm.swappiness = 180

# Read 0 pages per swap-in fault: correct for zram (no seek penalty), and it
# avoids reading more than needed from the compressed device.
vm.page-cluster = 0

# Do not over-eagerly wake kswapd on a low-RAM box.
vm.watermark_boost_factor = 0

# Flush dirty pages a bit sooner so a slow HDD is never hit by big bursts.
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
