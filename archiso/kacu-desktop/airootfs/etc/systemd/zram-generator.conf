# ==========================================================================
# kacuOS — zram swap for a 4 GB RAM / HDD machine
#
# zram-generator reads /usr/lib/systemd/zram-generator.conf first, then this
# file in /etc/systemd/ overrides it. No `systemctl enable` is needed: the
# generator creates systemd-zram-setup@zram0.service on demand at boot.
#
# Why these values:
#   zram-size = ram          -> a compressed swap device as large as RAM.
#                               On 4 GB this is the sweet spot: cheap, and it
#                               lets the kernel keep more anonymous pages in
#                               compressed form instead of thrashing the HDD.
#   zstd                     -> best compression/CPU ratio on an old CPU.
#   swap-priority = 100      -> prefer zram over any on-disk swap.
# ==========================================================================
[zram0]
zram-size = ram
compression-algorithm = zstd
swap-priority = 100
